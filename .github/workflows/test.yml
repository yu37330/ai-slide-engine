name: Test and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-local.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_skill.py
      - run: python skills/ai-slide-engine/scripts/build.py build skills/ai-slide-engine/examples/sample.json output
      - uses: actions/upload-artifact@v4
        with:
          name: ai-slide-engine-copilot-skill
          path: dist/ai-slide-engine.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sample-deck
          path: output/
