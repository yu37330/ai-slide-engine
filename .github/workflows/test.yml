name: Test and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-local.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_skill.py
      - run: python skills/ai-slide-engine/scripts/build.py build skills/ai-slide-engine/examples/sample.json output
      - name: Verify checked-in skill ZIP
        run: python scripts/verify_skill_zip.py dist/ai-slide-engine.zip releases/ai-slide-engine.zip
      - name: Generate Copilot Chat upload ZIP
        run: python scripts/package_copilot_skill.py
      - name: Verify checked-in Copilot Chat ZIP
        run: python scripts/verify_skill_zip.py dist/ai-slide-engine-copilot.zip releases/ai-slide-engine-copilot.zip
      - run: npm install --ignore-scripts --omit=dev
      - run: npx playwright-core install chromium
      - name: HTML browser and native DrawingML regression
        run: |
          npm run test:html
          node --test tests/test_image_export.mjs
      - name: Smoke test actual restored upload package
        run: |
          python -m zipfile -e dist/ai-slide-engine-copilot.zip "$RUNNER_TEMP/upload"
          python "$RUNNER_TEMP/upload/scripts/bootstrap_copilot.py" "$RUNNER_TEMP/upload" "$GITHUB_WORKSPACE/.copilot-runtime"
          python -c 'import json; r=json.load(open(".copilot-runtime/runtime-report.json")); assert r["native_ready"] and r["svg_html_ready"], r'
          python .copilot-runtime/scripts/render_html.py .copilot-runtime/examples/sample.json "$RUNNER_TEMP/copilot-sample"
          node .copilot-runtime/html/native.mjs "$RUNNER_TEMP/copilot-sample"
          test -s "$RUNNER_TEMP/copilot-sample/deck-native.pptx"

  template-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yuu551/jinno-slide-kit
          ref: b5814e92b1c4bcc6d78f1c357ebe05de9030f5e2
          path: .parity-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright-core install chromium
      - run: ln -s "$GITHUB_WORKSPACE/node_modules" .parity-upstream/node_modules
      - name: Verify frozen HTML catalog and compare all pages independently
        run: |
          echo '2e93b9ed51362805d90ccc82df4476444022493b0fa70757a029051cd5ca8d29  skills/ai-slide-engine/templates/catalog.zip' | sha256sum -c -
          python scripts/package_copilot_skill.py
          python -m zipfile -e dist/ai-slide-engine-copilot.zip "$RUNNER_TEMP/upload"
          python "$RUNNER_TEMP/upload/scripts/bootstrap_copilot.py" "$RUNNER_TEMP/upload" "$GITHUB_WORKSPACE/.copilot-runtime" --restore-only
          SKILL_ROOT="$GITHUB_WORKSPACE/.copilot-runtime" node tests/pixel_parity.mjs .parity-upstream .copilot-runtime/templates/catalog.zip
  aws-official:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yuu551/jinno-slide-kit
          ref: b5814e92b1c4bcc6d78f1c357ebe05de9030f5e2
          path: .parity-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned official AWS icon package for ephemeral testing only
        run: |
          url='https://d1.awsstatic.com/onedam/marketing-channels/website/public/shared/architecture-icon-release/Icon-package_07312026.5846e92413caa21490223536cc97f1269e44fa92.zip'
          curl --fail --location --retry 2 --max-time 90 "$url" -o "$RUNNER_TEMP/aws.zip"
          sha=d2d166c453526471749d520e0db022c459abef759d2946cf2dd1d1c992dc6526
          python skills/ai-slide-engine/scripts/aws_assets.py import "$RUNNER_TEMP/aws.zip" "$RUNNER_TEMP/aws-cache" --source "$url" --sha256 "$sha" > "$RUNNER_TEMP/aws-import.json"
          echo "OFFICIAL_AWS_CACHE=$RUNNER_TEMP/aws-cache" >> "$GITHUB_ENV"
      - name: Actual AWS S3, Lambda and Bedrock icons
        run: python -m unittest discover -s tests -p test_aws_official.py -v
      - name: All original drawing demos and primitives, SVG byte regression
        run: python tests/figure_parity.py .parity-upstream "$RUNNER_TEMP/figure-parity" --aws-cache "$OFFICIAL_AWS_CACHE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright-core install chromium
      - name: Both themes, fresh SVG pixel parity
        run: node tests/figure_pixels.mjs "$RUNNER_TEMP/figure-parity"
  pptx-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yuu551/jinno-slide-kit
          ref: b5814e92b1c4bcc6d78f1c357ebe05de9030f5e2
          path: .parity-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CI-only renderer and font dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils fontconfig
          python -m pip install 'fonttools[woff]' numpy Pillow
          python scripts/install_parity_fonts.py .parity-upstream/marp/themes/assets "$HOME/.local/share/fonts/slide-parity"
          fc-cache -f
          fc-match 'Noto Sans JP'
          fc-match 'Noto Sans JP:style=Bold'
          libreoffice --version
          pdftoppm -v
      - run: npm install --ignore-scripts
      - run: npx playwright-core install chromium
      - run: ln -s "$GITHUB_WORKSPACE/node_modules" .parity-upstream/node_modules
      - name: Compare original PPTX and HTML PPTX with independent rendering
        run: |
          python scripts/package_copilot_skill.py
          python -m zipfile -e dist/ai-slide-engine-copilot.zip "$RUNNER_TEMP/upload"
          python "$RUNNER_TEMP/upload/scripts/bootstrap_copilot.py" "$RUNNER_TEMP/upload" "$GITHUB_WORKSPACE/.copilot-runtime" --restore-only
          SKILL_ROOT="$GITHUB_WORKSPACE/.copilot-runtime" node tests/pptx_parity.mjs .parity-upstream "$RUNNER_TEMP/pptx-parity"
